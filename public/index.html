<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TADI Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="search-dialog" role="dialog" aria-labelledby="app-title">
    <header class="dialog-titlebar">
      <div class="dialog-brand">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span id="app-title">TADI <strong>Search</strong></span>
      </div>
      <button class="dialog-close" type="button" aria-label="Cerrar">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <section class="dialog-content">
      <div class="search-wrap">
        <div class="field">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="search-input" type="text" placeholder="¿Qué trámite necesitás hacer?" autocomplete="off" spellcheck="false" aria-label="Buscar trámite">
          <button id="clear-btn" class="clear-btn" type="button" title="Limpiar" aria-label="Limpiar búsqueda">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <button id="ai-btn" class="btn btn-primary" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.5 2a2.5 2.5 0 0 1 5 0v.5a2.5 2.5 0 0 1-5 0V2z"></path>
            <path d="M4.5 8a4 4 0 0 1 7.5-1.9A4 4 0 0 1 19.5 8"></path>
            <path d="M4.5 8v.5a4 4 0 0 0 4 4h7a4 4 0 0 0 4-4V8"></path>
            <path d="M8.5 12.5v4a2 2 0 0 0 4 0v-1"></path>
            <path d="M15.5 12.5v2a2 2 0 0 1-4 0"></path>
          </svg>
          <span>Buscar con IA</span>
        </button>
      </div>

      <div id="empty-state" class="state-empty">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <strong>Empezá a escribir</strong>
        <p>
          Los resultados aparecen mientras escribís.<br>
          Presioná <kbd>Enter</kbd> o <kbd>Buscar con IA</kbd> para una sugerencia inteligente.
        </p>
      </div>

      <div id="ai-card" class="ai-card"></div>
      <div id="results-meta" class="results-meta"></div>
      <div id="results" class="results-grid"></div>
    </section>
  </main>
</body>
</html>
